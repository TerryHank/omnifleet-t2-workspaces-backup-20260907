common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688
      # Request the host maximum; Linux reports twice this value as SO_RCVBUF.
      socket_recv_buf: 10485760
      min_distance: 0.2
      max_distance: 200.0
      # Use the robot's synchronized host time until the Airy clock is verified.
      use_lidar_clock: false
      dense_points: false
      ts_first_point: true
      start_angle: 0.0
      end_angle: 360.0

    ros:
      ros_frame_id: rslidar
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_send_point_cloud_topic: /rslidar_points
      ros_queue_length: 10
