# Calibration snapshot from the current Airy adapter. Launch overrides only topics and output frame.
/**:
  ros__parameters:
    input_topic: /rslidar_imu_data
    output_topic: /omnifleet_t2/experiments/rslidar_imu_corrected
    output_frame: robot_113/rslidar
    linear_acceleration_scale: 9.869805429
    angular_velocity_bias:
    - -0.003321103
    - -0.018058449
    - 0.008707792
    rotation_xyzw:
    - -0.7068467736244202
    - 0.7073657512664795
    - -0.0005705897347070277
    - 0.000999057781882584
    drop_non_increasing_timestamps: true
    use_sim_time: false
