bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: robot_113/map
    robot_base_frame: robot_113/base_link
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 5000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator/NavigateThroughPosesNavigator
    default_nav_to_pose_bt_xml: /home/iecme/workspace/omnifleet_t2_ws/install/omnifleet_planner/share/omnifleet_planner/behavior_trees/navigate_to_pose_with_selectors.xml
    default_nav_through_poses_bt_xml: /home/iecme/workspace/omnifleet_t2_ws/install/omnifleet_planner/share/omnifleet_planner/behavior_trees/navigate_through_poses_with_selectors.xml
    automatic_recovery: true
    automatic_replanning: true
    replanning_interval: 3.0
    plugin_lib_names:
    - omnifleet_navigation_policy_bt_node
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - omnifleet_continuous_route_bt_node
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    - continuous_goal_checker
    controller_plugins:
    - FollowPath
    - FollowPathRPP
    - FollowPathMPPI
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: omnifleet_planner::FootprintSafeGoalChecker
      stateful: false
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      safe_hold_time: 0.35
    continuous_goal_checker:
      plugin: omnifleet_planner::FootprintSafeGoalChecker
      stateful: false
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      safe_hold_time: 0.35
      require_ordered_waypoints: true
    FollowPath:
      plugin: omnifleet_dwb_hot::HotDWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.2
      max_speed_xy: 0.4
      min_speed_theta: 0.6
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.2
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - ObstacleFootprint
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      ObstacleFootprint.scale: 1.0
      BaseObstacle.scale: 0.5
      PathAlign.scale: 100.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 100.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 70.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    FollowPathRPP:
      plugin: omnifleet_planner::HotRegulatedPurePursuitController
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.2
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0
      allow_reversing: false
    FollowPathMPPI:
      plugin: omnifleet_planner::OrderedMPPI
      time_steps: 56
      model_dt: 0.0666667
      batch_size: 1000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.4
      vx_min: -0.35
      vy_max: 0.0
      wz_max: 1.2
      ax_max: 0.8
      ax_min: -0.8
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.5
      iteration_count: 1
      prune_distance: 1.7
      enforce_path_inversion: true
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      reset_period: 1.0
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: robot_113/map
      robot_base_frame: robot_113/base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.25, 0.185], [0.25, -0.185], [-0.25, -0.185], [-0.25, 0.185]]'
      footprint_padding: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        origin_z: 0.0
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 0.5
        observation_sources: lidar lidar_clearing
        lidar:
          topic: /rslidar_points
          sensor_frame: robot_113/rslidar
          clearing: false
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          min_obstacle_height: -0.03
          max_obstacle_height: 0.5
          observation_persistence: 0.0
        min_obstacle_height: -0.03
        lidar_clearing:
          topic: /rslidar_points
          sensor_frame: robot_113/rslidar
          clearing: true
          marking: false
          data_type: PointCloud2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          min_obstacle_height: -2.0
          max_obstacle_height: 4.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.1
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: robot_113/map
      robot_base_frame: robot_113/base_link
      transform_tolerance: 0.5
      footprint: '[[0.25, 0.185], [0.25, -0.185], [-0.25, -0.185], [-0.25, 0.185]]'
      footprint_padding: 0.05
      resolution: 0.1
      rolling_window: false
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        origin_z: 0.0
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 0.5
        observation_sources: lidar lidar_clearing
        lidar:
          topic: /rslidar_points
          sensor_frame: robot_113/rslidar
          clearing: false
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          min_obstacle_height: -0.03
          max_obstacle_height: 0.5
          observation_persistence: 0.0
        min_obstacle_height: -0.03
        lidar_clearing:
          topic: /rslidar_points
          sensor_frame: robot_113/rslidar
          clearing: true
          marking: false
          data_type: PointCloud2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          min_obstacle_height: -2.0
          max_obstacle_height: 4.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.1
      always_send_full_costmap: true
      peer_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /msc/peer_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    - GridNavFn
    - GridThetaStar
    - GridHybrid
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.2
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_travel_multiplier: 3.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
    GridNavFn:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.2
      use_astar: true
      allow_unknown: false
      use_final_approach_orientation: false
    GridThetaStar:
      plugin: nav2_theta_star_planner/ThetaStarPlanner
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      use_final_approach_orientation: true
    GridHybrid:
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.4
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      tolerance: 0.25
      max_planning_time: 3.0
      allow_unknown: false
      smooth_path: true
      plugin: nav2_smac_planner/SmacPlannerHybrid
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: robot_113/map
    robot_base_frame: robot_113/base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.5
